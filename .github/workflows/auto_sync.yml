name: DLHD Playlist Auto Update

on:
  workflow_dispatch:
  # Render থেকে সিগন্যাল পাওয়ার ট্রিগার
  repository_dispatch:
    types: [source_updated]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DaddyLive Scraper
        run: |
          python files/stc.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # তৈরি হওয়া ফাইল ট্র্যাকিংয়ে যোগ
          git add strmcntr.json strmcntr.m3u logs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto: Update Playlists from Render Trigger"
          git push
